<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlackMagic</title>
    <meta name="description" content="BlackMagic">
    <meta name="author" content="BlackMagic" />
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preload" href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=satoshi@400,500,700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://api.fontshare.com/v2/css?f[]=clash-display@700&f[]=satoshi@400,500,700&display=swap" rel="stylesheet" /></noscript>
    <link rel="icon" href="data:,">
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BlackMagic">
    <meta property="og:description" content="BlackMagic">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; background: #080808; }
      #root { height: 100%; }
      #app-loader {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #080808; z-index: 9999;
        transition: opacity 0.25s ease;
      }
      #app-loader.hidden { opacity: 0; pointer-events: none; }
      .bm-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.08);
        border-top-color: rgba(139,92,246,0.8);
        animation: spin 0.75s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app-loader"><div class="bm-spinner"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        var root = document.getElementById('root');
        var loader = document.getElementById('app-loader');
        if (!loader) return;
        var observer = new MutationObserver(function() {
          if (root.children.length > 0) {
            loader.classList.add('hidden');
            setTimeout(function() { loader.remove(); }, 300);
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
        setTimeout(function() { loader.classList.add('hidden'); setTimeout(function() { loader.remove(); }, 300); }, 5000);
      });
    </script>
  </body>
</html>
